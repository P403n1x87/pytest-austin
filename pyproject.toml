[project]
name = "pytest-austin"
description = "Austin plugin for pytest"
authors = [
  {name = "Gabriele N. Tornetta", email = "phoenix1987@gmail.com"},
]
license = "GPL-3.0-or-later"
readme = "README.md"

keywords = ["performance", "profiling", "testing", "development"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.11"
dependencies = [
  "austin-python>=2.0.0",
  "ansimarkup>=1.4.0,<2.0.0",
]

dynamic = ["version"]

[project.urls]
homepage = "https://github.com/P403n1x87/pytest-austin"
repository = "https://github.com/P403n1x87/pytest-austin"
issues = "https://github.com/P403n1x87/pytest-austin/issues"

[project.entry-points.pytest11]
cool_plugin = "pytest_austin.plugin"

[tool.hatch.envs.tests]
template = "tests"
dependencies = [
  "pytest>=5.4.2",
  "pytest-cov>=2.8.1",
]
[tool.hatch.envs.tests.scripts]
tests = "pytest --cov=pytest_austin --cov-report=term-missing --cov-report=xml {args}"

[[tool.hatch.envs.tests.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.checks]
python = "3.14"
template = "checks"
dependencies = [
  "mypy>=1.11",
  "flake8>=7.1",
  "flake8-annotations>=3.0",
  "flake8-black",
  "flake8-bugbear>=24.4",
  "flake8-docstrings>=1.7",
  "flake8-isort>=7.0",
]

[tool.hatch.envs.checks.scripts]
typing = "mypy --show-error-codes --install-types --non-interactive {args} pytest_austin/ test/"
linting = "flake8 {args} pytest_austin/ test/"

[tool.hatch.envs.coverage]
python = "3.14"
template = "coverage"
dependencies = [
  "coverage[toml]",
  "codecov",
]

[tool.hatch.envs.coverage.scripts]
cov = "coverage xml --fail-under=50"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["pytest_austin"]

[tool.coverage.run]
branch = true
source = ["pytest_austin"]

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
